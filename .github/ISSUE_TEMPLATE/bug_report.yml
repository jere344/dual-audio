name: Bug report
description: Something is not working
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Audio devices involved
      placeholder: "e.g. AirPods Pro (Bluetooth) + Realtek speakers"
  - type: textarea
    id: log
    attributes:
      label: Error log (optional)
      description: Paste the contents of %AppData%\DualAudio\error.log if present.
      render: text
