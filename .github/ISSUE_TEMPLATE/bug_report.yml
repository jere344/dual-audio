name: Bug report
description: Something is not working
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Windows 11 23H2, or Ubuntu 24.04 (PipeWire)"
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Audio devices involved
      placeholder: "e.g. AirPods Pro (Bluetooth) + Realtek speakers"
  - type: textarea
    id: log
    attributes:
      label: Error log (optional)
      description: Paste the contents of error.log if present (%AppData%\DualAudio on Windows, ~/.config/DualAudio on Linux).
      render: text
