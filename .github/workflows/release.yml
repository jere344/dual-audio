name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: target/release/dual-audio.exe
            asset: DualAudio.exe
          - os: ubuntu-22.04
            binary: target/release/dual-audio
            asset: dual-audio-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --release -- -D warnings -A clippy::chunks_exact_to_as_chunks

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Self-test
        run: ${{ matrix.binary }} --selftest

      - name: Rename
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DualAudio.exe
            dual-audio-linux-x86_64
          generate_release_notes: true
