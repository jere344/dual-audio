[package]
name = "dual-audio"
version = "2.0.0"
edition = "2024"
description = "Play your PC's audio through several output devices at the same time"
license = "Apache-2.0"
repository = "https://github.com/jere344/dual-audio"
build = "build.rs"

[[bin]]
name = "dual-audio"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
pulseaudio = "0.3.2"
futures = { version = "0.3", default-features = false, features = ["executor"] }
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.18"
tray-icon = "0.26"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
